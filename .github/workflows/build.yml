name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    - name: Create local.properties
      run: |
        echo "sdk.dir=${{ runner.tool_cache }}/android-sdk" > local.properties

    - name: Prepare fixed signing key
      env:
        KEYSTORE_B64: ${{ secrets.CT_KEYSTORE_B64 }}
      run: |
        if [ -n "$KEYSTORE_B64" ]; then
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/copytrading.keystore"
          echo "CT_KEYSTORE=$RUNNER_TEMP/copytrading.keystore" >> "$GITHUB_ENV"
          echo "Cle de signature fixe preparee."
        else
          echo "Secret absent : cle de debug par defaut."
        fi

    - name: Build Debug APK
      env:
        CT_KEYSTORE_PASS: ${{ secrets.CT_KEYSTORE_PASS }}
        CT_KEY_PASS: ${{ secrets.CT_KEY_PASS }}
      run: gradle assembleDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: copytrading-debug
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
