name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    - name: Decode keystore
      run: echo "${{ secrets.KEYSTORE_JKS }}" | base64 -d > app/release-keystore.jks

    - name: Create local.properties
      run: |
        echo "sdk.dir=${{ runner.tool_cache }}/android-sdk" > local.properties
        echo "keystore.password=${{ secrets.KEYSTORE_PASSWORD }}" >> local.properties
        echo "key.alias=${{ secrets.KEY_ALIAS }}" >> local.properties
        echo "key.password=${{ secrets.KEY_PASSWORD }}" >> local.properties

    - name: Build Release APK
      run: gradle assembleRelease

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: copytrading-release
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: copytrading-debug
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
